services:
  - type: web
    name: dndparty-api
    runtime: node
    plan: free
    buildCommand: |
      npm install --include=dev
      npx prisma generate
      npx prisma migrate deploy
      npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
